<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T4</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;    
            background-color: #1a1a1a; 
        }

        canvas {
            background-color: black; /* Fundo do canvas */
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5); 
            border: 1px solid #333;
        }
        /* O fundo que escurece a tela */
        .overlay {
            display: none; /* Escondido por padrão */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        /* A caixa branca do formulário */
        .modal-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        textarea {
            height: 100px;
            resize: none;
        }

        .secondary {
            background: #ccc;
            border: none;
            margin-left: 5px;
        }        
    </style>
</head>
<body>
    <div id="modalOverlay" class="overlay">
        <div class="modal-box">
            <h3>Dados do Objeto</h3>
            <p>Insira as coordenadas ou o texto do arquivo:</p>
            <textarea id="inputData" placeholder="Ex: V 0 0 0..."></textarea>
            <div class="actions">
                <button id="confirmBtn">Confirmar</button>
                <button id="cancelBtn" class="secondary">Cancelar</button>
            </div>
        </div>
    </div>
    <canvas id="meuCanvas" width="640" height="480"></canvas>
    <script> 
        const sleep = (ms) => new Promise(r => setTimeout(r, ms)); // Para debug
        //- Branco:   (255, 255, 255)
        //- Vermelho: (255, 0, 0)
        //- Roxo:     (160, 32, 240)
        //- Azul:     (0, 0, 255)
        //- Verde:    (0, 255, 0)
        //- Amarelo:  (255, 255, 0)
        const canvas = document.getElementById('meuCanvas');
        const ctx = canvas.getContext('2d');
        const setPixel = (posx, posy, color) => {
            switch (color) {
                case 1:
                    ctx.fillStyle = "rgb(255, 255, 255)";
                    ctx.fillRect(posx, posy, 1, 1)
                    break;
                case 2:
                    ctx.fillStyle = "rgb(255, 0, 0)";
                    ctx.fillRect(posx, posy, 1, 1)                    
                    break;
                case 3:
                    ctx.fillStyle = "rgb(160, 32, 240)";
                    ctx.fillRect(posx, posy, 1, 1)                    
                    break; 
                case 4:
                    ctx.fillStyle = "rgb(0, 0, 255)";
                    ctx.fillRect(posx, posy, 1, 1)
                    break;
                case 5:
                    ctx.fillStyle = "rgb(0, 255, 0)";
                    ctx.fillRect(posx, posy, 1, 1)
                    break;                  
                default:
                    ctx.fillStyle = "rgb(255, 255, 0)";
                    ctx.fillRect(posx, posy, 1, 1)
                    break;
            }
        } 
        const linhaBres = (xi, yi, xf, yf, color) =>{
            var dx = Math.abs(xf - xi)
            var dy = Math.abs(yf - yi)
            var sx = (xi < xf) ? 1:-1
            var sy = (yi < yf) ? 1:-1
            var err = dx - dy

            while (true) {
                setPixel(xi,yi,color)
                if (xi == xf && yi == yf) {
                    break;
                }
                var e2 = 2*err
                if (e2>-dy) {
                    err -= dy
                    xi += sx
                }
                if(e2<dx) {
                    err+=dx
                    yi+=sy
                }
            }
        }        
        // Parametros das cores
        //- Branco:   0
        //- Vermelho: 1
        //- Roxo:     2
        //- Azul:     3
        //- Verde:    4
        //- Amarelo:  5

        // Pontos no formato [[x,y],[x2,y2]]
        // Desenha as bordas do poligono
        const desenhar = (pixels, cor) =>{
            for (var index = pixels.length-1; index > 0; index--) {
                var element = pixels[index];
                var element2 = pixels[index-1];
                linhaBres(element[0], element[1], element2[0], element2[1], cor)
                // Esse if liga o ultimo ponto da lista de pixels com o primeiro pra fechar o poligono
                if (index == pixels.length-2){
                    linhaBres(pixels[0][0], pixels[0][1], pixels[pixels.length-1][0], pixels[pixels.length-1][1], cor)
                }
            }
            // Tive q fazer um forEach na mão porque o JavaScript é uma bomba              
        }

        // Gera os pixels das extremidades do poligono e depois desenha espera 1s e pinta o poligono
        const geraPoligono = async () =>{
            var pixels = []
            var cor = Math.floor(Math.random() * 6)
            var numPixels = Math.floor(Math.random() * 7 + 3)
            while (numPixels > 0) {
                pixels.push([
                    Math.floor(Math.random() * 640), 
                    Math.floor(Math.random() * 480)
                ])
                numPixels--
            }
            desenhar(pixels, cor) 
            await sleep(1000)
            pintar(pixels, cor)
        }
        const modal = document.getElementById('modalOverlay');
        const confirmBtn = document.getElementById('confirmBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const inputField = document.getElementById('inputData');
        window.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && modal.style.display !== 'flex') {
                event.preventDefault(); 
                modal.style.display = 'flex';
                inputField.focus();
            }
        });

        // Fecha o modal sem fazer nada
        cancelBtn.onclick = () => {
            modal.style.display = 'none';
            inputField.value = ''; // Limpa o campo
        };

        // Lógica principal: Captura o texto e fecha
        confirmBtn.onclick = () => {
            const dados = inputField.value;
            
            if (dados.trim() !== "") {
                console.log("Dados recebidos para processar o 3D:", dados);
                criarObj(dados)
                modal.style.display = 'none'; // Fecha após confirmar
                inputField.value = ''; // Limpa para a próxima
            } else {
                alert("Por favor, preencha o campo!");
            }
        };

        // Fecha se clicar fora da caixa branca
        window.onclick = (event) => {
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        };       
//      Tabela da análise Geométrica
//      | Lado | Ymin | Ymáx | x do Ymin | 1/m = Δx/Δy |
//      Se Δy = 0, excluir linha

// Pixels = [
//        [x,y],
//        [x2,y2]
//]
        const pintar = async (pixels, cor) => {
            var tabela = [];
            
            // 1. Preenchimento tabela
            for (var index = pixels.length - 1; index > 0; index--) {
                var ponto = pixels[index];
                var pontoAntes = pixels[index - 1];
                
                var dx = ponto[0] - pontoAntes[0];
                var dy = ponto[1] - pontoAntes[1];

                if (dy != 0) {
                    var xYmin = (ponto[1] < pontoAntes[1]) ? ponto[0] : pontoAntes[0];
                    tabela.push([
                        index, 
                        Math.min(ponto[1], pontoAntes[1]), 
                        Math.max(ponto[1], pontoAntes[1]), 
                        xYmin, 
                        dx / dy // m
                    ]);
                }

                // 2. Fechamento do polígono (último com o primeiro)
                if (index == 1) {
                    var pUltimo = pixels[pixels.length - 1];
                    var pPrimeiro = pixels[0];
                    var dxF = pUltimo[0] - pPrimeiro[0];
                    var dyF = pUltimo[1] - pPrimeiro[1];
                    if (dyF != 0) {
                        var xYminF = (pUltimo[1] < pPrimeiro[1]) ? pUltimo[0] : pPrimeiro[0];
                        tabela.push([
                            pixels.length, 
                            Math.min(pUltimo[1], pPrimeiro[1]), Math.max(pUltimo[1], pPrimeiro[1]), xYminF, dxF / dyF
                        ]);
                    }
                }
            }

            var yMin = Math.min(...tabela.map(linha => linha[1]));
            var yMax = Math.max(...tabela.map(linha => linha[2]));

            // 3. Segundo passo do algoritmo
            for (let yVarredura = yMin; yVarredura <= yMax; yVarredura++) {
                let intersecoesNestaLinha = []

                for (let i = 0; i < tabela.length; i++) {
                    var ylinhaMin = tabela[i][1]
                    var ylinhaMax = tabela[i][2]

                    // Verificação se a linha Y intercepta a aresta
                    // Tirei do slide 
                    if (yVarredura >= ylinhaMin && yVarredura < ylinhaMax) {
                        // Equação da reta: X = mInv * (y - yMin) + xNoYMin
                        // Tirei do slide tbm
                        let xCalc = tabela[i][4] * (yVarredura - ylinhaMin) + tabela[i][3];
                        intersecoesNestaLinha.push(xCalc)
                    }
                }

                // 4. Ordenar as interseções de X para linha de varredura
                intersecoesNestaLinha.sort((a, b) => a - b)

                // Pintar os pixels entre os pares de interseções
                for (let i = 0; i < intersecoesNestaLinha.length; i += 2) {
                    let xInicio = Math.ceil(intersecoesNestaLinha[i])
                    let xFim = Math.floor(intersecoesNestaLinha[i + 1])
                    
                    for (let x = xInicio; x <= xFim; x++) {
                        setPixel(x, yVarredura, cor)
                    }
                }
            }
        }
        
        // P(x, y, z) => P'(x', y') {x' = x + z * L * cos(alpha); y' = y + z * L * sen(alpha)}
        const transformCoordenadas = (ponto,L,alpha) =>{
            const anguloRadianos = alpha * (Math.PI/180)

            const sen = Math.sin(anguloRadianos).toFixed(4)
            const cos = Math.cos(anguloRadianos).toFixed(4)

            var pontoT = [Math.round(ponto[0] + ponto[2] * L * cos), Math.round(ponto[1] + ponto[2]*L*sen)]
            return pontoT
        }


        const zoom = (ponto, escala) =>{
            ponto[0] = ponto[0] * escala
            ponto[1] = ponto[1] * escala
        }
        
        const processaDados = (dados) =>{
            const linhas = dados.trim().split(/\r?\n/)
            const a = parseInt(linhas[0]);
            const b = parseInt(linhas[1]);
            const strParaNumeros = (linha) => linha.trim().split(/\s+/).map(Number);
            const matrizA = linhas.slice(2, a + 2).map(strParaNumeros);
            const matrizB = linhas.slice(a + 2).map(strParaNumeros);

            return {
                vertices: matrizA,
                arestas: matrizB
            }
        }

        const criarObj = (dados) =>{
            const {vertices, arestas} = processaDados(dados) 
            coordenadasTela = []
            for (let index = 0; index < vertices[index].length; index++) {
                var element = transformCoordenadas(vertices[index], 0.5, 45);
                coordenadasTela.push(element)
            }
            for (let index = 0; index < arestas.length-1; index++) {
                linhaBres(coordenadasTela[arestas[index][0]][0], coordenadasTela[arestas[index][0]][1], coordenadasTela[arestas[index+1][1]][0], coordenadasTela[arestas[index+1][1]][1]) // transformar em objeto
            }
        }

    </script>
</body>
</html>
