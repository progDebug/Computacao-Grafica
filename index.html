<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T4</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;    
            background-color: #1a1a1a; 
        }

        canvas {
            background-color: black; /* Fundo do canvas */
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5); 
            border: 1px solid #333;
        }
        /* O fundo que escurece a tela */
        .overlay {
            display: none; /* Escondido por padrão */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        /* A caixa branca do formulário */
        .modal-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        textarea {
            height: 100px;
            resize: none;
        }

        .secondary {
            background: #ccc;
            border: none;
            margin-left: 5px;
        }        
    </style>
</head>
<body>
    <!-- Tudo sobre o canvas e funcionalidades da página -->
    <script type="module" src="./canva.js"></script>
    <!-- Tudo sobre rasterização -->
    <script type="module" src="./rast.js"></script>
    <!-- [...] poligonos -->
    <script type="module" src="./poligono.js"></script>
    <div id="modalOverlay" class="overlay">
        <div class="modal-box">
            <h3>Dados do Objeto</h3>
            <p>Insira as coordenadas ou o texto do arquivo:</p>
            <textarea id="inputData" placeholder="Ex: V 0 0 0..."></textarea>
            <div class="actions">
                <button id="confirmBtn">Confirmar</button>
                <button id="cancelBtn" class="secondary">Cancelar</button>
            </div>
        </div>
    </div>
    <canvas id="meuCanvas" width="640" height="480"></canvas>
</body>
</html>
